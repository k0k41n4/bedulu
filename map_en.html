<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedulu Exploration Map | Custom Icons</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #fbbf24;
            --bg-dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: white;
            overflow: hidden;
            /* Biar gak double scroll */
        }

        .map-wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
            flex-direction: row;
            /* Default buat laptop */
        }

        /* Sidebar Styling */
        .sidebar {
            width: 380px;
            background: #0a0f1d;
            border-right: 1px solid rgba(251, 191, 36, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            width: 100%;
        }

        .back-home {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        h2 {
            color: var(--primary);
            margin: 5px 0;
            font-size: 1.5rem;
        }

        .subtitle {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        /* Destinasi Cards */
        .location-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .dest-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .dest-item:hover,
        .dest-item.active {
            border-color: var(--primary);
            background: rgba(251, 191, 36, 0.1);
        }

        .dest-item h4 {
            margin: 0;
            color: var(--primary);
            font-size: 1rem;
        }

        .dest-item p {
            margin: 5px 0 0;
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* Legend */
        .legend {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 1rem;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
        }

        .legend-img {
            width: 16px;
            height: 16px;
        }
        .btn-location {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2000;
            background: #fbbf24;
            border: none;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.2s;
        }

        .btn-location:hover {
            transform: scale(1.1);
        }

        /* --- RESPONSIVE MODE (HP) --- */
        @media (max-width: 768px) {
            .map-wrapper {
                flex-direction: column;
                /* Peta di atas, sidebar di bawah */
            }

            #map {
                height: 50vh;
                /* Peta ambil setengah layar atas */
                width: 100%;
            }

            .sidebar {
                width: 100%;
                height: 50vh;
                /* Sidebar ambil setengah layar bawah */
                border-right: none;
                border-top: 2px solid var(--primary);
                /* padding: 15px; */
                box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.5);
                /* border-radius: 20px 20px 0 0; */
                /* Biar kayak Bottom Sheet */
            }

            h2 {
                font-size: 1rem;
            }

            .subtitle {
                margin-bottom: 1px;
            }

            .location-list {
                margin-top: 4px;
                display: flex;
                /* Di HP bisa scroll menyamping juga kalau mau, tapi vertikal tetep aman */
                flex-direction: column;
                width: 90%;
            }

            .legend {
                margin-bottom: 0;
            }

        }
    </style>
    </style>
</head>

<body>

    <div class="map-wrapper">
        <div class="sidebar">
            <a href="./index.html" class="back-home">← Return to Home</a>
            <h2>Bedulu Destination</h2>
            <p class="subtitle">Select a destination to see nearby facilities..</p>
            <button id="btnLocation" class="btn-location">Show Your Location 📍</button>
            <div class="legend">
                <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/3358/3358485.png"
                        class="legend-img"> ATM</div>
                <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/4320/4320350.png"
                        class="legend-img"> Clinic</div>
                <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/4721/4721028.png"
                        class="legend-img"> Café</div>
                <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/890/890964.png"
                        class="legend-img"> Gas Station</div>
            </div>
            <div class="location-list" id="dest-list">
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   
    <script>
        const map = L.map('map').setView([-8.525, 115.295], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const iconLib = {

            atm: "https://cdn-icons-png.flaticon.com/512/3358/3358485.png",
            rs: "https://cdn-icons-png.flaticon.com/512/4320/4320350.png",
            cafe: "https://cdn-icons-png.flaticon.com/512/4721/4721028.png",
            spbu: "https://cdn-icons-png.flaticon.com/512/890/890964.png"
        };

        const createIcon = (url, size = 32) => L.icon({
            iconUrl: url,
            iconSize: [size, size],
            iconAnchor: [size / 2, size],
            popupAnchor: [0, -size]
        });

        // Data Wisata dengan Link Google Maps
      const dataWisata = [
        {
            name: "Goa Gajah",
            coords: [-8.5230, 115.2861],
            image: "assets/img/goa-gajah.jpg",
            link: "https://maps.app.goo.gl/tAbwxrcKK6iqZ7o87",
            info: "./destinations/goa_gajah.html",
            desc: "A 9th century spiritual site with a giant relief of Bhoma.",
            facilities: [
        // Cafe / Restaurant
        { 
            name: "Layana Warung",

            pos: [-8.52216933241419, 115.28434208951046],
            link: "https://maps.app.goo.gl/SMhKCkmwZmEHWZFV7"
        },
        {

            type: "cafe", 
            pos: [-8.522946095227779, 115.28628858331332],
            link: "https://maps.app.goo.gl/zrrf7teeyHUm9e3M6"
        },
        { 
            name: "Dagoja Coffee & Eatery", 
            type: "cafe", 
            pos: [-8.523082199401749, 115.28891718789305],
            link: "https://maps.app.goo.gl/iE7JerXAmGnRN2iW8"
        },

        // ATM
        { 
            name: "ATM Ari Canti", 
            type: "atm", 
            pos: [-8.551241236212926, 115.2730972790292],
            link: "https://maps.app.goo.gl/dbum2UNH7uW69fY78"
        },
        { 
            name: "ATM BCA Alfamart", 
            type: "atm", 
            pos: [-8.523047465523442, 115.28950287913747],
            link: "https://www.google.com/maps?q=-8.523047465523442,115.28950287913747"
        },

        // SPBU
        { 
            name: "SPBU 1", 
            type: "spbu", 
            pos: [-8.526202294282195, 115.29507309018554],
            link: "https://www.google.com/maps?q=-8.526202294282195,115.29507309018554"
        },
        { 
            name: "SPBU 2", 
            type: "spbu", 
            pos: [-8.523135550165794, 115.27609169456596],

        },

        // Rumah Sakit
        { 
            name: "RS Ari Canti", 
            type: "rs", 
            pos: [-8.551923926366497, 115.27334763130145],
            link: "https://maps.app.goo.gl/9RDEvXKpN3LWsvkP6"
        }
    ]
    },

    {
        name: "Yeh Pulu",
        coords: [-8.5295, 115.2933],
        image: "assets/img/yeh-pulu.jpg",
        link: "https://maps.app.goo.gl/bF3Ad6M6fW7pKo3o6",
        info: "./destinations/yeh_pulu.html",
        desc: "A 25-meter ancient relief depicting Balinese agrarian life.",
        facilities: [
            {
                name: "Yeh Pulu Cafe",
                type: "cafe",
                pos: [-8.529487861842291, 115.29360804768964],

            },
            {

                type: "cafe",
                pos: [-8.529116505666765, 115.29377970906117],
                link: "https://maps.app.goo.gl/U4r3Ck3aAJ3qqtSA7"
            }
        ]
    },

    {

        coords: [-8.527, 115.305],

        desc: "An ancient hermitage site carved directly into the river cliff wall.",
        facilities: [
            // Cafe
            { 
                name: "Warung Vegetarian", 
                type: "cafe", 
                pos: [-8.534504387622038, 115.3057971850287],
                link: "https://www.google.com/maps?q=-8.534504387622038,115.3057971850287"
            },
            { 
                name: "Hanzo Coffee", 
                type: "cafe", 
                pos: [-8.534592474189719, 115.30731323443588],
                link: "https://www.google.com/maps?q=-8.534592474189719,115.30731323443588"
            },

            // SPBU
            { 
                name: "SPBU", 
                type: "spbu", 
                pos: [-8.534870387945382, 115.30691594168132],
                link: "https://www.google.com/maps?q=-8.534870387945382,115.30691594168132"
            },

            // ATM
            { 
                name: "ATM", 
                type: "atm", 
                pos: [-8.535087958014918, 115.30775424247172],
                link: "https://www.google.com/maps?q=-8.535087958014918,115.30775424247172"
            },

            // Rumah Sakit
            { 
                name: "Rumah Sakit", 
                type: "rs", 
                pos: [-8.537200169803606, 115.32239368963268],

    },

    {
        name: "Pura Samuan Tiga",
        coords: [-8.5237, 115.295],
        image: "assets/img/samuan-tiga.jpg",
        link: "https://maps.app.goo.gl/aEM4yiLdjkoMpHfj6",
        info: "./destinations/pura_samuan_tiga.html",
        desc: "A historical place of unification of Hindu sects in Bali.",
        facilities: [
            { 
                name: "Dagoja Coffee", 
                type: "cafe", 
                pos: [-8.523082199401749, 115.28891718789305],
                link: "https://www.google.com/maps?q=-8.523082199401749,115.28891718789305"
            },
            { 
                name: "ATM", 
                type: "atm", 
                pos: [-8.535087958014918, 115.30775424247172],
                link: "https://www.google.com/maps?q=-8.535087958014918,115.30775424247172"
            }
        ]
    }
];

        const destList = document.getElementById('dest-list');

        dataWisata.forEach((dest) => {
            // 1. Render Marker Utama dengan Tombol Google Maps di Popup
            const popupContent = `
                <div style="color:black; min-width:200px">
                    
                    <img src="${dest.image}" 
                         style="width:100%; height:120px; object-fit:cover; border-radius:8px; margin-bottom:8px;">
                    
                    <b style="font-size:1.1rem">${dest.name}</b>

                    <a href="${dest.link}" target="_blank" 
                       style="display:block; background:#fbbf24; color:black; text-align:center; 
                              text-decoration:none; padding:8px; border-radius:5px; font-weight:bold; font-size:0.8rem; margin-top:8px;">
                       🚗 Open in Google Maps
                    </a>

                    <a href="${dest.info}" target="_blank" 
                       style="display:block; background:#fbbf24; color:black; text-align:center; 
                              text-decoration:none; padding:8px; border-radius:5px; font-weight:bold; font-size:0.8rem; margin-top:5px;">
                       Click for More
                    </a>
                </div>
            `;

            const mainMarker = L.marker(dest.coords, { icon: createIcon(iconLib.dest, 40) })
                .addTo(map)
                .bindPopup(popupContent);

            // 2. Render Fasilitas
            dest.facilities.forEach(f => {
                L.marker(f.pos, {
                    icon: createIcon(iconLib[f.type] || iconLib.dest, 28)
                })
                    .addTo(map)
                    .bindPopup(`<div style="color:black"><b>${f.name}</b><br>Fasilitas: ${f.type.toUpperCase()}</div><a href="${f.link}" target="_blank" 
                       style="display:block; background:#fbbf24; color:black; text-align:center; 
                              text-decoration:none; padding:8px; border-radius:5px; font-weight:bold; font-size:0.8rem; margin-top:8px;">
                       🚗 Open in Google Maps
                    </a>`);
            });

            // 3. Render Sidebar Item
            const item = document.createElement('div');
            item.className = 'dest-item';
            item.innerHTML = `
                <h4>📍 ${dest.name}</h4>
                <p>${dest.desc}</p>
            `;

            item.onclick = () => {
                document.querySelectorAll('.dest-item').forEach(d => d.classList.remove('active'));
                item.classList.add('active');
                map.flyTo(dest.coords, 16, { animate: true, duration: 1.5 });
                mainMarker.openPopup();
            };

            destList.appendChild(item);
        });

        let userMarker = null;
let accuracyCircle = null;

document.getElementById("btnLocation").addEventListener("click", () => {
    if (!navigator.geolocation) {
        alert("Browser Not Supported GPS");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Hapus marker lama kalau ada
            if (userMarker) map.removeLayer(userMarker);
            if (accuracyCircle) map.removeLayer(accuracyCircle);

            // Marker titik user (biru)
            userMarker = L.circleMarker([lat, lng], {
                radius: 8,
                color: "#3b82f6",
                fillColor: "#3b82f6",
                fillOpacity: 1
            }).addTo(map).bindPopup("📍 Your Location").openPopup();

            // Lingkaran akurasi GPS
            accuracyCircle = L.circle([lat, lng], {
                radius: accuracy,
                color: "#3b82f6",
                fillOpacity: 0.1
            }).addTo(map);

            // Fokus ke lokasi user
            map.flyTo([lat, lng], 16, {
                animate: true,
                duration: 1.5
            });
        },
        (err) => {
            alert("Failure to take the location");
        }
    );
});
    </script>
</body>

</html>
