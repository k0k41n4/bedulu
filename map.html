<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Eksplorasi Bedulu | Custom Icons</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #fbbf24;
            --bg-dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: white;
            overflow: hidden;
            /* Biar gak double scroll */
        }

        .map-wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
            flex-direction: row;
            /* Default buat laptop */
        }

        /* Sidebar Styling */
        .sidebar {
            width: 380px;
            background: #0a0f1d;
            border-right: 1px solid rgba(251, 191, 36, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            width: 100%;
        }

        .back-home {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        h2 {
            color: var(--primary);
            margin: 5px 0;
            font-size: 1.5rem;
        }

        .subtitle {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        /* Destinasi Cards */
        .location-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .dest-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .dest-item:hover,
        .dest-item.active {
            border-color: var(--primary);
            background: rgba(251, 191, 36, 0.1);
        }

        .dest-item h4 {
            margin: 0;
            color: var(--primary);
            font-size: 1rem;
        }

        .dest-item p {
            margin: 5px 0 0;
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* Legend */
        .legend {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 1rem;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
        }

        .legend-img {
            width: 16px;
            height: 16px;
        }

        /* --- RESPONSIVE MODE (HP) --- */
        @media (max-width: 768px) {
            .map-wrapper {
                flex-direction: column;
                /* Peta di atas, sidebar di bawah */
            }

            #map {
                height: 50vh;
                /* Peta ambil setengah layar atas */
                width: 100%;
            }

            .sidebar {
                width: 100%;
                height: 50vh;
                /* Sidebar ambil setengah layar bawah */
                border-right: none;
                border-top: 2px solid var(--primary);
                /* padding: 15px; */
                box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.5);
                /* border-radius: 20px 20px 0 0; */
                /* Biar kayak Bottom Sheet */
            }

            h2 {
                font-size: 1rem;
            }

            .subtitle {
                margin-bottom: 1px;
            }

            .location-list {
                margin-top: 4px;
                display: flex;
                /* Di HP bisa scroll menyamping juga kalau mau, tapi vertikal tetep aman */
                flex-direction: column;
                width: 90%;
            }

            .legend {
                margin-bottom: 0;
            }
        }
    </style>
    </style>
</head>

            </div>
            <div class="location-list" id="dest-list">
            </div>
        </div>

        <div id="map"></div>

    <script>
        const map = L.map('map').setView([-8.525, 115.295], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const iconLib = {
            dest: "https://cdn-icons-png.flaticon.com/512/1483/1483336.png",
            atm: "https://cdn-icons-png.flaticon.com/512/3358/3358485.png",
            rs: "https://cdn-icons-png.flaticon.com/512/4320/4320350.png",
            cafe: "https://cdn-icons-png.flaticon.com/512/4721/4721028.png",
            spbu: "https://cdn-icons-png.flaticon.com/512/890/890964.png"
        };

        const createIcon = (url, size = 32) => L.icon({
            iconUrl: url,
            iconSize: [size, size],
            iconAnchor: [size / 2, size],
            popupAnchor: [0, -size]
        });

        // Data Wisata dengan Link Google Maps
        const dataWisata = [
            {
                name: "Goa Gajah",
                coords: [-8.5230, 115.2861],
                link: "https://maps.app.goo.gl/tAbwxrcKK6iqZ7o87",
                info: "./destinasi/goa_gajah.html",
                desc: "Situs spiritual abad ke-9 dengan relief raksasa Bhoma.",
                facilities: [
                    { name: "Layana Warung", type: "cafe", pos: [-8.522, 115.288] },
                    { name: "ATM Center", type: "atm", pos: [-8.524, 115.285] },
                    { name: "RSUD Sanjiwani", type: "rs", pos: [-8.537, 115.3] }
                ]
            },
            {
                name: "Yeh Pulu",
                coords: [-8.5295, 115.2933],
                link: "https://maps.app.goo.gl/bF3Ad6M6fW7pKo3o6",
                info: "./destinasi/yeh_pulu.html",
                desc: "Relief kuno 25 meter yang menceritakan kehidupan agraris Bali.",
                facilities: [
                    { name: "Yeh Pulu Café", type: "cafe", pos: [-8.529, 115.294] },
                    { name: "SPBU Goa Gajah", type: "spbu", pos: [-8.552, 115.27] }
                ]
            },
            {
                name: "Candi Tebing",
                coords: [-8.527, 115.305],
                link: "https://maps.app.goo.gl/kP5Yjsz6Qua5yshj7",
                info: "./destinasi/candi_tebing.html",
                desc: "Situs pertapaan kuno yang dipahat langsung di dinding tebing sungai.",
                facilities: [
                    { name: "Hanzo Coffee Bedulu", type: "cafe", pos: [-8.534, 115.307] },
                    { name: "ATM", type: "atm", pos: [-8.535, 115.308] }
                ]
            },
            {
                name: "Pura Samuan Tiga",
                coords: [-8.5237, 115.295],
                link: "https://maps.app.goo.gl/aEM4yiLdjkoMpHfj6",
                info: "./destinasi/pura_samuan_tiga.html",
                desc: "Tempat bersejarah penyatuan sekte Hindu di Bali.",
                facilities: [
                    { name: "Dagoja Coffee", type: "cafe", pos: [-8.522, 115.288] },
                    { name: "ATM", type: "atm", pos: [-8.535, 115.308] }
                ]
            }
        ];

        const destList = document.getElementById('dest-list');

        dataWisata.forEach((dest) => {
            // 1. Render Marker Utama dengan Tombol Google Maps di Popup
            const popupContent = `
                <div style="color:black; min-width:150px">
                    <b style="font-size:1.1rem">${dest.name}</b><br>
                    <a href="${dest.link}" target="_blank" 
                       style="display:block; background:#fbbf24; color:black; text-align:center; 
                              text-decoration:none; padding:8px; border-radius:5px; font-weight:bold; font-size:0.8rem; margin-bottom: 1rem;">
                       🚗 Buka di Google Maps
                    </a>
                    <a href="${dest.info}" target="_blank" 
                       style="display:block; background:#fbbf24; color:black; text-align:center; 
                              text-decoration:none; padding:8px; border-radius:5px; font-weight:bold; font-size:0.8rem">
                       Klik untuk Selengkapnya
                    </a>
                </div>
            `;

            const mainMarker = L.marker(dest.coords, { icon: createIcon(iconLib.dest, 40) })
                .addTo(map)
                .bindPopup(popupContent);

            // 2. Render Fasilitas
            dest.facilities.forEach(f => {
                L.marker(f.pos, {
                    icon: createIcon(iconLib[f.type] || iconLib.dest, 28)
                })
                    .addTo(map)
                    .bindPopup(`<div style="color:black"><b>${f.name}</b><br>Fasilitas: ${f.type.toUpperCase()}</div>`);
            });

            // 3. Render Sidebar Item
            const item = document.createElement('div');
            item.className = 'dest-item';
            item.innerHTML = `
                <h4>📍 ${dest.name}</h4>
                <p>${dest.desc}</p>
            `;

            item.onclick = () => {
                document.querySelectorAll('.dest-item').forEach(d => d.classList.remove('active'));
                item.classList.add('active');
                map.flyTo(dest.coords, 16, { animate: true, duration: 1.5 });
                mainMarker.openPopup();
            };

            destList.appendChild(item);
        });
    </script>
</body>
